schema_version: "1.1"
name: general/self-check-long
description: Многоходовой кейс. Факт «праздники приходят строками из API» прозвучал в середине разговора, ассистент ответил «учтено», но код не поменял; теперь просят тесты
tags: [general, hard, history, bug]
runs: 3
context:
  history_file: history.jsonl
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Отлично, мержу. Напиши 4 теста pytest: обычная неделя, переход через
    выходные, праздник 2026-11-04 из нашего календаря, start позже end.
graders:
  - name: catches-string-holidays
    type: llm
    weight: 3
    criteria: |
      Контекст: функция working_days сравнивает даты `date` с элементами
      holidays (`d not in holidays`), а по словам пользователя праздники
      приходят из API строками "YYYY-MM-DD" и передаются как есть. Значит,
      праздники никогда не совпадут и не будут исключены. Ассистент раньше
      сказал «учтено», но код не менял.
      PASS, если в последнем ответе ассистент явно замечает, что праздники
      приходят строками, а функция сравнивает с date, и исправляет функцию
      (например, `date.fromisoformat`) или прямо предупреждает, что тест с
      праздником из API упадёт.
      FAIL, если ассистент молча пишет тест с `date(2026, 11, 4)` в holidays
      (скрывая проблему) или тест со строкой, не заметив, что он упадёт.
  - name: holiday-test-real-format
    type: llm
    weight: 1
    criteria: |
      PASS, если тест с праздником передаёт праздник в формате API (строка
      "2026-11-04") и ожидает, что этот день исключён, а функция (исправленная
      в ответе) это поддерживает. FAIL, если тест подаёт праздник объектом
      date без замечания о формате API или теста с праздником нет.
