schema_version: "1"
name: odoo-model-map/field-impact
description: >
  «Что сломается, если переименовать поле». Упоминания живут в строках:
  @api.depends, related через Many2one, xpath в наследнике вью, вью
  _inherits-модели, домен в search() и фильтре, read([...]).
  Ловушки: одноимённые подстроки odometer_at и td.odometer.export.
tags: [odoo-model-map, positive, odoo]
context:
  scaffold_script: setup.sh
execution:
  prompt: |
    В каталоге `addons/` наши модули Odoo 19. Хочу переименовать поле
    `odometer` модели `td.vehicle` в `odometer_km`. Что сломается или что
    придётся поправить? Дай полный список мест (файл:строка). Кода пока не
    меняй.
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: tool_used
    name: skill-fired
    tool: Skill
    input_match: odoo-model-map
    min: 1
  - type: llm
    name: cross-module-python
    criteria: >
      PASS, если ответ называет ВСЕ эти места в других модулях: (1)
      @api.depends("odometer", ...) в td_fleet_service/models/maintenance.py;
      (2) @api.depends('odometer', ...) и использование vehicle.odometer в
      td_fleet_report/models/kpi.py; (3) related='vehicle_id.odometer' у
      поля vehicle_odometer (td.vehicle.service) в td_fleet_report/models/kpi.py;
      (4) домен ('odometer', '>=', ...) и read([... 'odometer']) в
      td_fleet_report/wizard/odometer_export.py. FAIL, если пропущено
      хотя бы одно из четырёх.
  - type: llm
    name: xml-places
    criteria: >
      PASS, если ответ называет ВСЕ эти XML-места: (1) xpath
      //field[@name='odometer'] в наследнике вью
      td_fleet_service/views/td_vehicle_views.xml; (2) поле odometer в
      форме td.service.card (td_fleet_service/views/td_vehicle_service_views.xml),
      видное через _inherits; (3) колонка odometer в наследнике списка
      td_fleet_report/views/td_vehicle_views.xml; (4) домен фильтра
      high_mileage в td_fleet/views/td_vehicle_views.xml. FAIL, если
      пропущено хотя бы одно из четырёх.
  - type: llm
    name: hidden-places
    criteria: >
      PASS, если ответ называет хотя бы 3 из 4 мест, которые не являются
      ни Python-полями, ни вью: (1) _order = 'odometer desc, name' в
      td_fleet_report/models/kpi.py; (2) код серверного действия
      action_mark_service_due (v.odometer) в
      td_fleet_service/data/td_vehicle_service_actions.xml; (3) t-field="v.odometer"
      в QWeb-отчёте td_fleet_report/report/td_vehicle_report.xml; (4)
      демо-данные <field name="odometer"> в td_fleet/data/td_vehicle_demo.xml.
      FAIL, если названо меньше трёх.
  - type: llm
    name: no-false-hits
    criteria: >
      PASS, если ответ НЕ требует переименовывать поле odometer_at модели
      td.vehicle.service, модель td.odometer.export или метод
      action_reset_odometer как часть переименования поля (упоминание, что
      их трогать не нужно или что это отдельное имя, допустимо). FAIL,
      если какой-либо из них включён в список обязательных правок.
  - type: llm
    name: not-searched
    criteria: >
      PASS, если ответ явно оговаривает, где поиск НЕ проводился или что
      может сломаться вне кода модулей (например: ядро Odoo, другие
      репозитории, данные в базе — сохранённые фильтры, серверные
      действия, экспорт, миграция хранимых данных). FAIL, если такой
      оговорки нет.
