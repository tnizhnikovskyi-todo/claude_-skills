schema_version: "1"
name: odoo-model-map/access-map
description: >
  Явная просьба «карта моделей» с правами. Заложено: мастер без строк
  доступа (пустой csv в td_fleet_report), _inherits-модель с правами только
  у менеджера, глобальные и групповые ir.rule с путями через другую модель.
tags: [odoo-model-map, positive, odoo]
context:
  scaffold_script: setup.sh
execution:
  prompt: |
    Составь карту моделей наших модулей Odoo 19 в `addons/`: модули и их
    зависимости, какие модели где определены и расширены, и какие права
    доступа и правила записей на них действуют. Есть ли модели без прав?
    Кода не меняй.
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: tool_used
    name: skill-fired
    tool: Skill
    input_match: odoo-model-map
    min: 1
  - type: llm
    name: models-complete
    criteria: >
      PASS, если карта перечисляет все определённые модели: td.vehicle,
      td.vehicle.tag (td_fleet), td.vehicle.service, td.service.card
      (td_fleet_service), td.odometer.export (td_fleet_report), а также
      расширения res.partner (td_fleet), td.vehicle (td_fleet_service и
      td_fleet_report) и td.vehicle.service (td_fleet_report). FAIL, если
      пропущена хотя бы одна модель или одно из расширений.
  - type: llm
    name: missing-acl
    criteria: >
      PASS, если ответ прямо говорит, что у мастера td.odometer.export
      (TransientModel, td_fleet_report) нет строк в ir.model.access.csv
      (файл пустой), и это проблема. FAIL, если это не найдено или сказано,
      что у всех моделей права есть.
  - type: llm
    name: rules
    criteria: >
      PASS, если ответ перечисляет правила записей: глобальное правило по
      компании на td.vehicle и три правила на td.vehicle.service
      (глобальное по компании vehicle_id.company_id, групповое для
      base.group_user по водителю, групповое для менеджера [(1,'=',1)]).
      FAIL, если какое-то из четырёх правил пропущено.
  - type: llm
    name: inherits-access
    criteria: >
      PASS, если ответ отмечает связь прав td.service.card с td.vehicle
      через _inherits (например: доступ к карточке требует прав/правил
      td.vehicle, или права на карточку есть только у менеджера флота,
      а обычный пользователь её не откроет). FAIL, если про права
      td.service.card ничего, кроме строки csv, не сказано.
