schema_version: "1"
name: odoo-model-map/typo-negative
description: >
  Негативный кейс: правка подписи поля в модуле Odoo. Карта модели не нужна,
  скилл не должен срабатывать.
tags: [odoo-model-map, negative, odoo]
context:
  scaffold_script: setup.sh
execution:
  prompt: |
    В `addons/td_fleet/models/vehicle.py` у поля `license_plate` подпись
    'Licence Plate' — исправь на 'License Plate'.

    Запись файлов в этой среде отключена: покажи изменение как unified diff
    в ответе.
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: tool_used
    name: skill-not-fired
    tool: Skill
    input_match: odoo-model-map
    min: 0
    max: 0
  - type: llm
    name: only-the-label
    criteria: >
      PASS, если дифф меняет только строку string='Licence Plate' на
      'License Plate' в td_fleet/models/vehicle.py и не содержит других
      правок. FAIL, если дифф содержит другие изменения или его нет.
