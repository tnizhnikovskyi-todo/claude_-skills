schema_version: "1"
name: skill-feedback/no-trigger
description: >
  Обычная правка в репозитории скиллов без поправки к результату скилла.
  Скилл не срабатывает, observations/ не создаётся.
tags: [skill-feedback, negative]
context:
  scaffold_script: setup.sh
execution:
  prompt: |
    В skills/repo-audit/references/odoo-checklist.md опечатка: в строке про
    controllers/ вместо `auth='public'` должно быть `auth='public'` или
    `auth='none'`. Допиши `auth='none'` в эту строку, больше ничего не меняй.
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Write, Edit, Glob, Grep, Skill]
runs: 3
graders:
  - type: tool_used
    name: not-fired
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?skill-feedback"'
    min: 0
    max: 0
  - type: file_exists
    name: no-observation
    path: "observations/*.md"
    exists: false
  - type: regex
    name: edit-done
    pattern: "auth='none'"
    target:
      source: file
      path: skills/repo-audit/references/odoo-checklist.md
